name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Private development uses the trusted homelab pool. Once the repository is
    # public, including for fork PRs, only GitHub-hosted runners are eligible.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: golang:1.26.10-bookworm@sha256:23ce71337b726608afb1bc00986e630a05034a87a87ea1fc2cd1ae5cf33387eb
    env:
      # Preserve the upstream Wails build selection; do not exclude GUI packages.
      GOFLAGS: -tags=gtk3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust this checkout inside the job container
        # The runner owns the workspace; the container runs as root. The serve
        # integration test builds the CLI in a child Go process.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain
      - name: Linux libraries for Wails
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Secret scan (SEC-L03)
        run: |
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks-v8.30.1/gitleaks"
          scripts/install-gitleaks.sh "$GITLEAKS_BIN"
          GITLEAKS_BIN="$GITLEAKS_BIN" scripts/test-gitleaks.sh
          GITLEAKS_BIN="$GITLEAKS_BIN" scripts/scan-secrets.sh history
      - name: Packaging contract
        run: |
          apt-get install -y --no-install-recommends python3 zip
          python3 scripts/test-build-inventory.py -v
          python3 scripts/test-sidecar-security.py -v
          python3 scripts/test-packaging.py
          python3 scripts/test-appimage-abi.py -v
          python3 scripts/test-release.py
          python3 scripts/test-install.py
          # Pure window-ownership regressions run headlessly; native decoy is opt-in.
          python3 cmd/app/testdata/test_gui_smoke.py
      - name: Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Repository branding guard
        run: python3 scripts/test-brand-guard.py
      - name: Go version
        run: go version
      - name: Verify Go modules
        run: go mod verify
      - name: Vulnerability gate
        run: |
          GOBIN="$RUNNER_TEMP/security-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$RUNNER_TEMP/security-tools/govulncheck" ./...
      - name: vet
        run: go vet ./...
      - name: test
        # The complete synthetic MTProto/SQLite race suite can exceed Go's
        # default ten-minute package timeout; individual async waits are bounded.
        # Stage 4 retains a 30-minute package budget, covering the 20-minute
        # real-account regression suite allowance as well.
        run: go test -race -count=1 -timeout 60m ./...
      - name: build every program
        run: |
          go build -o "$RUNNER_TEMP/bin/" ./cmd/...
          python3 scripts/build-inventory.py \
            --binary "$RUNNER_TEMP/bin/app" \
            --binary "$RUNNER_TEMP/bin/telegram-mcp" \
            --binary "$RUNNER_TEMP/bin/telegram-mcp-bridge" \
            --output-dir "$RUNNER_TEMP/inventory"
          python3 scripts/build-inventory.py --check \
            --binary "$RUNNER_TEMP/bin/app" \
            --binary "$RUNNER_TEMP/bin/telegram-mcp" \
            --binary "$RUNNER_TEMP/bin/telegram-mcp-bridge" \
            --output-dir "$RUNNER_TEMP/inventory"
